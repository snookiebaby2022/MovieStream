<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>FlixNova</title>
  <style>
    html, body {
      margin: 0; height: 100%; background: #0a0a0a; color: #fff;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      display: flex; align-items: center; justify-content: center; text-align: center;
    }
    .box { padding: 24px; max-width: 360px; }
    .mark {
      width: 72px; height: 72px; margin: 0 auto 16px; border-radius: 16px;
      background: #e50914; display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 36px; box-shadow: 0 8px 28px rgba(229,9,20,.35);
    }
    h1 { font-size: 28px; margin: 0 0 8px; letter-spacing: .02em; }
    p { color: #b3b3b3; font-size: 14px; line-height: 1.5; margin: 0 0 18px; }
    a {
      display: inline-block; padding: 12px 18px; border-radius: 10px;
      background: #e50914; color: #fff; text-decoration: none; font-weight: 700;
    }
    .hint { margin-top: 14px; font-size: 12px; color: #808080; }
  </style>
</head>
<body>
  <div class="box">
    <div class="mark">F</div>
    <h1>FlixNova</h1>
    <p>Loading your stream… If nothing appears, open the site directly.</p>
    <a id="open" href="https://snookiebaby.xyz:8443/?app=1">Open FlixNova</a>
    <div class="hint">Android · Fire TV · iOS Home Screen</div>
  </div>
  <script>
    // Capacitor usually loads server.url; this is the offline/fallback shell.
    setTimeout(function () {
      location.replace('https://snookiebaby.xyz:8443/?app=1');
    }, 400);
  </script>
</body>
</html>
