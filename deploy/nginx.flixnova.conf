# FlixNova nginx — HTTPS on standard 443 (and 8443 redirect for old links)
# Install: copy to /etc/nginx/sites-available/moviestream && ln -sf … sites-enabled && nginx -t && systemctl reload nginx

upstream flixnova_api {
    server 127.0.0.1:3001;
    keepalive 32;
}

# Optional plain HTTP on 8080 (internal / non-CF)
server {
    listen 8080;
    server_name snookiebaby.xyz www.snookiebaby.xyz;
    root /var/www/moviestream/website;
    index index.html;
    client_max_body_size 20M;
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    # ^~ so socket.io client JS is not stolen by the static *.js regex below
    location ^~ /socket.io/ {
        proxy_pass http://flixnova_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location /api/ {
        proxy_pass http://flixnova_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location /admin { alias /var/www/moviestream/admin; try_files $uri $uri/ /admin/index.html; }
    location / { try_files $uri $uri/ /index.html; }
    location = /sitemap.xml { proxy_pass http://flixnova_api; }
    location = /robots.txt  { proxy_pass http://flixnova_api; }
}

# Primary HTTPS — no port in the public URL
server {
    listen 443 ssl http2;
    server_name snookiebaby.xyz www.snookiebaby.xyz;
    ssl_certificate     /etc/letsencrypt/live/snookiebaby.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/snookiebaby.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    root /var/www/moviestream/website;
    index index.html;
    client_max_body_size 20M;
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ^~ so socket.io client JS is not stolen by the static *.js regex below
    location ^~ /socket.io/ {
        proxy_pass http://flixnova_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location /api/ {
        proxy_pass http://flixnova_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location /admin { alias /var/www/moviestream/admin; try_files $uri $uri/ /admin/index.html; }
    location / { try_files $uri $uri/ /index.html; }
    location = /sitemap.xml { proxy_pass http://flixnova_api; }
    location = /robots.txt  { proxy_pass http://flixnova_api; }
}

# Old :8443 links → clean https://snookiebaby.xyz/...
server {
    listen 8443 ssl http2;
    server_name snookiebaby.xyz www.snookiebaby.xyz;
    ssl_certificate     /etc/letsencrypt/live/snookiebaby.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/snookiebaby.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://snookiebaby.xyz$request_uri;
}
