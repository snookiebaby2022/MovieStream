# Example Nginx config for FlixNova
# Copy to /etc/nginx/sites-available/ and enable.
# Adjust SSL paths and upstream port as needed.

upstream flixnova_api {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 8443 ssl http2;
    server_name snookiebaby.xyz;

    # ssl_certificate     /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;

    root /var/www/moviestream/website;
    index index.html;

    # API + sockets → Node
    location /api/ {
        proxy_pass http://flixnova_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://flixnova_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /admin/ {
        alias /var/www/moviestream/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # PWA
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Shareable watch URLs + SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
