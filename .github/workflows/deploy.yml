name: Deploy to Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          set -e
          cd /var/www/moviestream
          git pull origin main
          cd backend
          npm ci --omit=dev
          pm2 restart moviestream --update-env || pm2 start ecosystem.config.js
          # Bust stale source cache after scraper upgrades
          redis-cli FLUSHDB || true
          echo "✅ FlixNova deployment complete"
